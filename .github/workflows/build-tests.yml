name: Build Tests

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install_extras: 'test'
      test_path: 'tests'
      # inject_mode="tool" uses the ToolCall / MessageRole.TOOL contract; chromadb on
      # PyPI is a 0.0.0 placeholder. Both are pulled from dev until they release.
      pre_install_pip: 'git+https://github.com/OpenVoiceOS/ovos-plugin-manager@dev git+https://github.com/OpenVoiceOS/ovos-chromadb-embeddings-plugin@dev'
