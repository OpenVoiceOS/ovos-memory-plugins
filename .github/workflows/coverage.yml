name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      coverage_source: 'ovos_memory_plugins'
      test_path: 'tests'
      install_extras: '.[test]'
      min_coverage: 0
      # LocalRAGMemory inject_mode="tool" + its tests use the ToolCall / MessageRole.TOOL
      # contract, which lives on this ovos-plugin-manager branch until it releases.
      pre_install_pip: 'git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/agent-tool-calling'
