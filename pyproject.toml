[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-memory-plugins"
dynamic = ["version"]
description = "OVOS OPM memory plugins: long-term rolling summarization and RAG via OpenAI-compatible endpoints"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" }
]
keywords = ["ovos", "plugin", "memory", "rag", "llm", "summarization"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ovos-plugin-manager>=0.0.1",
    "ovos-utils>=0.0.1",
    "requests>=2.28",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov",
    "fastapi",
    "uvicorn",
    "httpx",
    "types-requests",
    "mypy",
]

[project.entry-points."opm.agents.memory"]
ovos-memory-plugin-longterm = "ovos_memory_plugins.longterm:LongTermMemory"
ovos-memory-plugin-rag = "ovos_memory_plugins.rag:RAGMemory"

[tool.setuptools.dynamic]
version = { attr = "ovos_memory_plugins.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_memory_plugins*"]
