[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-memory-plugins"
dynamic = ["version"]
description = "OVOS OPM memory plugins: local-first long-term rolling summarization and fully-local in-process RAG"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" }
]
keywords = ["ovos", "plugin", "memory", "rag", "llm", "summarization"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ovos-plugin-manager>=2.3.0a1,<3.0.0",
    "ovos-utils>=0.0.1,<1.0.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# Fully-local in-process RAG stack: a text-embeddings plugin + an EmbeddingsDB
# plugin. The defaults below are a known-good, fully-offline pairing.
local-rag = [
    # ovos-chromadb-embeddings-plugin has only a 0.0.0 placeholder on PyPI; install
    # the real plugin from git (CI does this via pre_install_pip) until it releases.
    "ovos-chromadb-embeddings-plugin",
    "ovos-gguf-plugin",
]
test = [
    "pytest>=7",
    "pytest-cov",
    "fastapi",
    "uvicorn",
    "httpx",
    "types-requests",
    "mypy",
    # union of everything the test suite imports for real (no skips):
    # the local-rag e2e test exercises the actual gguf + chromadb stack.
    # chromadb is git-installed in CI (pre_install_pip) — PyPI has only a 0.0.0 placeholder.
    "ovos-chromadb-embeddings-plugin",
    "ovos-gguf-plugin",
]

[project.entry-points."opm.agents.memory"]
ovos-memory-plugin-longterm = "ovos_memory_plugins.longterm:LongTermMemory"
ovos-memory-plugin-local-rag = "ovos_memory_plugins.local_rag:LocalRAGMemory"

[tool.setuptools.dynamic]
version = { attr = "ovos_memory_plugins.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_memory_plugins*"]
